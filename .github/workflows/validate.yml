name: Validate Warpath
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: python tests/run.py
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Warpath-1.0.0-alpha.1
          path: dist/Warpath-1.0.0-alpha.1.zip
